name: Deploy to Vercel

# This workflow deploys to Vercel on push to main.
# Disabled by default — only runs on manual trigger until the
# required secrets are set. See README below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

# REQUIRED SECRETS (set in GitHub repo Settings → Secrets):
#   VERCEL_TOKEN          - https://vercel.com/account/tokens
#   VERCEL_ORG_ID         - Vercel project Settings → General
#   VERCEL_PROJECT_ID     - Vercel project Settings → General
#   NEXT_PUBLIC_SUPABASE_URL              - already set
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY  - already set
#
# Without VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID the deploy
# step aborts with: "_ArgError: option requires argument: --token"
#
# TO ENABLE: create a Vercel account, link this repo to a Vercel
# project, get the 3 IDs above, and set them as GitHub Secrets.
# Then uncomment the `push:` block above.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # NOTE: don't run `next build` here. Let Vercel run it with the
      # --build-env vars so Supabase env vars are available during
      # static page generation.

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm install -g vercel
          vercel --token $VERCEL_TOKEN --yes \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"